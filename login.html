<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINTEC - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 space-y-6 page-transition">
        
        <div class="flex flex-col items-center text-center space-y-2">
            <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-md shadow-blue-200 inline-block">
                <i data-lucide="zap" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-black tracking-wider text-blue-900 pt-2">SINTEC</h1>
            <p class="text-sm font-semibold text-slate-500">Plataforma de Treinamento Técnico</p>
        </div>

        <form id="login-form" class="space-y-4">
            
            <div class="space-y-1.5">
                <label for="ra" class="text-sm font-bold text-slate-700 block">Registro Acadêmico (RA)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </span>
                    <input type="text" id="ra" name="ra" placeholder="Ex: 123456" required
                        class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 rounded-xl pl-11 pr-4 py-3.5 text-sm font-semibold text-slate-800 placeholder-slate-400 outline-none transition">
                </div>
            </div>

            <div class="space-y-1.5">
                <label for="password" class="text-sm font-bold text-slate-700 block">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 rounded-xl pl-11 pr-4 py-3.5 text-sm font-semibold text-slate-800 placeholder-slate-400 outline-none transition">
                </div>
            </div>

            <div id="error-message" class="hidden bg-rose-50 border border-rose-100 text-rose-600 text-xs font-bold p-3.5 rounded-xl flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span>RA ou senha incorretos. Tente novamente!</span>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-100 transition flex items-center justify-center gap-2 pt-4">
                Entrar no Treinamento <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="text-center pt-2">
            <span class="text-xs text-slate-400 font-medium">Ambiente de Avaliação SINTEC &copy; 2026</span>
        </div>
    </div>

    <script>
        // Inicializa os ícones do Lucide
        lucide.createIcons();

        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita o recarregamento da página

            const raValue = document.getElementById('ra').value.trim();
            const passwordValue = document.getElementById('password').value;

            // CONFIGURAÇÃO DOS DADOS DE TESTE (MOCK)
            // Deixei o RA como "123456" e senha como "123" para facilitar o teste na hora de apresentar!
            if (raValue === "123456" && passwordValue === "123") {
                errorMessage.classList.add('hidden');
                
                // Redireciona para a Dashboard principal
                window.location.href = "index.html";
            } else {
                // Mostra a mensagem de erro estilizada
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
