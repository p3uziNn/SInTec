<section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">

        id="about-toggle"

            </div>
            <span class="text-blue-900 font-bold text-lg">Quem Somos</span>

        <i data-lucide="chevron-down"
            class="w-5 h-5 text-slate-400 transition-transform duration-300"
            id="about-chevron">
        </i>
    </button>

    <!-- Conteúdo expansível -->

                    J
                </div>
                <div class="min-w-0">
                    <p class="font-bold text-slate-900 text-sm leading-tight truncate">João Silva</p>
                    <p class="text-xs text-slate-500 font-semibold mt-0.5">RA: 123456</p>
                    <span class="inline-block mt-1.5 text-xs font-bold text-blue-600
                                 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-full">

            <!-- Integrante 2 -->

                <div class="min-w-0">

<!--
  ================================================================
  Script da seção Quem Somos
  Cole este <script> também no final do index.html,
  ANTES do </body> — depois do <script src="app.js"></script>
  ================================================================
-->
<script>
    function toggleAbout() {
        const content  = document.getElementById('about-content');
        const chevron  = document.getElementById('about-chevron');
        const btn      = document.getElementById('about-toggle');
        const isHidden = content.classList.contains('hidden');

        content.classList.toggle('hidden', !isHidden);
        chevron.style.transform = isHidden ? 'rotate(180deg)' : '';
        btn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
    }
</script>
